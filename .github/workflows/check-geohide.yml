name: Check GeoHide provider documentation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch provider documentation with verified TLS
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://dns.geohide.ru/ -o "$RUNNER_TEMP/geohide.html"
          python3 - <<'PY'
          import os, pathlib, re
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.text = []; self.skip = False
              def handle_starttag(self, tag, attrs):
                  if tag in ('style', 'script'): self.skip = True
              def handle_endtag(self, tag):
                  if tag in ('style', 'script'): self.skip = False
              def handle_data(self, data):
                  if data.strip() and not self.skip: self.text.append(data.strip())
          raw = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'geohide.html').read_text()
          page = Page(); page.feed(raw)
          lines = '\n'.join(page.text)
          print(lines)
          for i in range(0, min(len(lines), 9000), 3000):
              chunk = lines[i:i+3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=GeoHide documentation {i//3000 + 1}::{chunk}')
          links = sorted(set(re.findall(r'(?:https?://[^\s\"<>]+|static/[^\s\"\x27`<>]+|[\w.-]+/dns-query)', raw)))
          print('::notice title=GeoHide endpoints::' + '\n'.join(links)[:3000].replace('%', '%25').replace('\n', '%0A'))
          PY
      - name: Read current provider servers and verify encrypted DNS responses
        run: |
          curl --fail --silent --show-error --max-time 30 https://dns.geohide.ru/static/metadata/servers.json -o "$RUNNER_TEMP/geohide-servers.json"
          python3 - <<'PY'
          import os, pathlib, urllib.request, struct, base64, json
          raw = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'geohide-servers.json').read_text()
          print('::notice title=Provider server metadata::' + raw[:3500].replace('%', '%25').replace('\n', '%0A'))
          query = struct.pack('!6H', 1234, 256, 1, 0, 0, 0) + b'\x07chatgpt\x03com\x00' + struct.pack('!2H', 1, 1)
          encoded = base64.urlsafe_b64encode(query).rstrip(b'=').decode()
          for host in ('geohide.ru', 'eu.geohide.ru', 'us.geohide.ru'):
              try:
                  request = urllib.request.Request('https://' + host + '/dns-query?dns=' + encoded, headers={'Accept': 'application/dns-message'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      answer = response.read(65536)
                      header = struct.unpack('!6H', answer[:12])
                      assert header[0] == 1234 and header[1] & 32768 and header[1] & 15 == 0 and header[3] > 0
                      print('::notice title=DoH response::' + host + ' returned a valid chatgpt.com DNS response')
              except Exception as error:
                  print('::warning title=DoH unavailable::' + host + ': ' + str(error))
          PY
